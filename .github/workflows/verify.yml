# The suite the README's quality claim rests on, run by something other than a
# person remembering to.
#
# Before this there was no workflow, no hook and no server-side gate: `git push`
# succeeded whatever it carried, and Vercel's default build command is
# `npm run build` — `vite build` alone — so `tsc --noEmit`, `oxlint` and
# scripts/verify.cjs never ran at deploy time either. A commit that broke forty
# checks reached production unchallenged, and the first signal was a reader
# hitting it. `npm run smoke`, the one thing that probes the deployed origin,
# was manual too.
#
# This workflow adds DETECTION, and it loses the race it is in: Vercel promotes
# the deploy while these jobs are still running. So the two cheap gates moved
# into the deploy itself — `npm run build` is now
# `tsc --noEmit && oxlint --deny-warnings && vite build`, and vercel.json names
# it as the buildCommand, so a type error or a lint failure stops the build
# instead of being reported after it shipped. The puppeteer suite stays here:
# a Chrome download on a Vercel builder is not worth the minutes, and it is the
# slow half. What that leaves unprotected is a commit that typechecks and lints
# and still breaks checks — for which the answer is a required status check on
# main, which lives in the repository settings and not in a file.
#
# puppeteer is deliberately not a devDependency — the README explains that it is
# to spare a fresh clone and a cold deploy the Chrome download. That argument is
# about clones and deploys, not about a CI runner that installs once per job, so
# it is added here with --no-save and nothing in package.json moves.
#
# One thing this runner cannot answer. index.css's metric-matched fallback faces
# wrap system faces by name — src:local('Arial'), local('Courier New'),
# local('Arial Narrow') — and `local()` matches an installed face rather than
# going through fontconfig's aliasing, so on Linux all three resolve to nothing
# even though `font-family: Arial` finds Liberation Sans. index.css says what
# happens then: the face is skipped and the stack behaves as it did before. The
# three font-swap checks therefore take their documented-degradation arm here and
# print "local() faces absent" in their detail line. The CLS guarantee they exist
# to pin is real, but it is pinned on a machine that has those faces — a green
# run here is not evidence for it. Installing them would not fix that either:
# msttcorefonts carries Arial and Courier New but no Arial Narrow.
name: verify

# …and smoke needs something other than a person remembering, too. smoke.cjs was
# written after an audit found the production alias three releases back, and the
# remedy was a manual script plus one README sentence — so the same class
# recurred: production sat on one commit while the branch grew 241 ahead of it,
# for weeks, and again the only thing that noticed was an audit. A script nothing
# runs is a script nothing runs.
# deployment_status is what the Vercel integration emits, so a deploy that went
# out and went out WRONG is caught within a minute of promotion; the daily
# schedule is what catches the other half, a deploy that never happened at all,
# which is the case that actually occurred and which no push-triggered job can
# see. workflow_dispatch so it can be asked directly.
on:
  push:
    branches: ['**']
  pull_request:
  deployment_status:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  verify:
    # the suite belongs to a commit, so the two origin-probing triggers skip it
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # This job reads a repository and runs a test suite; it has no reason to be
    # able to write one. With no `permissions:` block the job took the
    # repository's default GITHUB_TOKEN scope, and actions/checkout leaves that
    # token in $GITHUB_WORKSPACE/.git/config as an http.extraheader unless told
    # not to — so the line below that executes third-party install code was doing
    # so a directory away from a push credential for this repository, in a
    # workflow that runs on every push to every branch.
    permissions:
      contents: read
    steps:
      # PINNED BY DIGEST, both of them. `@v4` is a mutable major tag resolved at
      # run time, so these two lines execute whatever the tag points at when the
      # job starts — which is the same 'the tag moved' shape the puppeteer note
      # below cites, and the shape of the 2025-03 tj-actions/changed-files
      # incident, where a retagged major was the whole attack. The note used to
      # call that install 'the only line in the job that executes third-party
      # code' with these two standing above it; it was not, and a maintainer who
      # believed it would have thought the surface closed.
      # Digests are v4.4.0 of each, the tip of both v4 tags when this was pinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # matches engines.node in package.json
          node-version: '22.12'
          cache: npm
      - run: npm ci
      # Chrome for the puppeteer checks, from ITS OWN LOCKFILE.
      #
      # `npm i puppeteer@25.8.0` pinned one package out of the 27 it installs.
      # Six were exact — puppeteer, puppeteer-core, @puppeteer/browsers,
      # chromium-bidi, devtools-protocol, webdriver-bidi-protocol — and the tree
      # they pull declares 29 caret ranges (ws@^8.21.1, zod@^3.24.1,
      # yargs@^18.0.0, strip-ansi@^7.1.0, ansi-regex@^6.2.2 and the rest), so 21
      # of the 27 were whatever the registry served as the newest matching patch
      # at that minute, with no `integrity` anywhere. A compromised patch of any
      # one of them — the 2025-09 Shai-Hulud pattern, where the new version adds
      # a postinstall — was installed and executed here, either at install time
      # or inside the puppeteer process the suite drives.
      # The comment this replaces cited the 2025-09-08 chalk/debug incident,
      # which WAS a transitive compromise: an exact top-level pin does not stop
      # one, it only fixes which puppeteer asks for ws@^8.21.1.
      # ci/package-lock.json pins all 27 by `resolved` + `integrity`, and
      # `npm ci` refuses anything the lockfile does not describe. Dependabot
      # moves it on purpose (.github/dependabot.yml).
      #
      # --ignore-scripts, because exactly one of those 27 declares an install
      # script and it is puppeteer's own Chrome download. It is run on the next
      # line instead: deliberately, by name, AFTER the tree has been
      # integrity-checked, rather than as a side effect of resolution.
      #
      # `npm ci` at the repo root still runs none: of its 117 package-lock
      # entries exactly one declares an install script (fsevents, os:darwin, so
      # never on ubuntu-latest) and 116 carry `resolved` + `integrity` — the
      # 117th is the root entry `""`, which has neither by construction.
      #
      # What this does NOT cover, and should not be read as covering: the Chrome
      # build itself is an unhashed HTTPS download from storage.googleapis.com,
      # pinned only by puppeteer's own revisions table.
      - run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund
      - run: node ci/node_modules/puppeteer/install.mjs
      # PUPPETEER_PATH is a puppeteer PACKAGE DIRECTORY (README.md), and
      # verify.cjs require()s it — so it has to be absolute, or node reads it as
      # a bare package name and looks in node_modules.
      - run: npm run verify
        env:
          PUPPETEER_PATH: ${{ github.workspace }}/ci/node_modules/puppeteer

  # The deployed origin, which the job above cannot see: it checks the commit it
  # was handed, and every question smoke asks is about what readers are actually
  # served. No npm ci — smoke.cjs imports only node builtins and vercel.json —
  # and no secrets, because it is GET-only.
  smoke:
    # deployment_status fires for preview deployments as well, hence the
    # environment filter; the schedule and a manual run always qualify.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'deployment_status'
          && github.event.deployment_status.state == 'success'
          && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'
      # exit 1 is a real answer about the deploy and fails the job; exit 2 means
      # smoke could not reach the origin at all — DNS, a dropped packet, GitHub's
      # egress — which is not this repository's news and must not cry wolf every
      # morning. Annotated, not failed.
      - name: smoke the deployed origin
        run: |
          set +e
          node scripts/smoke.cjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::smoke could not reach the origin (exit 2) — network, not the deploy"
            exit 0
          fi
          exit $code
