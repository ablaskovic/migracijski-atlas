# The suite the README's quality claim rests on, run by something other than a
# person remembering to.
#
# Before this there was no workflow, no hook and no server-side gate: `git push`
# succeeded whatever it carried, and Vercel's default build command is
# `npm run build` — `vite build` alone — so `tsc --noEmit`, `oxlint` and
# scripts/verify.cjs never ran at deploy time either. A commit that broke forty
# checks reached production unchallenged, and the first signal was a reader
# hitting it. `npm run smoke`, the one thing that probes the deployed origin,
# was manual too.
#
# This workflow adds DETECTION, and it loses the race it is in: Vercel promotes
# the deploy while these jobs are still running. So the two cheap gates moved
# into the deploy itself — `npm run build` is now
# `tsc --noEmit && oxlint --deny-warnings && vite build`, and vercel.json names
# it as the buildCommand, so a type error or a lint failure stops the build
# instead of being reported after it shipped. The puppeteer suite stays here:
# a Chrome download on a Vercel builder is not worth the minutes, and it is the
# slow half. What that leaves unprotected is a commit that typechecks and lints
# and still breaks checks — for which the answer is a required status check on
# main, which lives in the repository settings and not in a file.
#
# puppeteer is deliberately not a devDependency — the README explains that it is
# to spare a fresh clone and a cold deploy the Chrome download. That argument is
# about clones and deploys, not about a CI runner that installs once per job, so
# CI installs it from a tree of its own: ci/package.json pins 25.8.0 and
# `npm ci --prefix ci` below resolves all 27 packages from ci/package-lock.json,
# every one with a `resolved` and an `integrity`. Nothing in the root
# package.json moves either way.
# This paragraph said "it is added here with --no-save", which was true of the
# `npm i --no-save puppeteer@25.8.0` this job used to run and stopped being true
# when the ci/ lockfile replaced it — and --no-save was exactly the property
# that made that install unpinned, which is the reason it was replaced.
#
# One thing this runner cannot answer. index.css's metric-matched fallback faces
# wrap system faces by name — src:local('Arial'), local('Courier New'),
# local('Arial Narrow') — and `local()` matches an installed face rather than
# going through fontconfig's aliasing, so on Linux all three resolve to nothing
# even though `font-family: Arial` finds Liberation Sans. index.css says what
# happens then: the face is skipped and the stack behaves as it did before. The
# three font-swap checks therefore take their documented-degradation arm here and
# print "local() faces absent" in their detail line. The CLS guarantee they exist
# to pin is real, but it is pinned on a machine that has those faces — a green
# run here is not evidence for it. Installing them would not fix that either:
# msttcorefonts carries Arial and Courier New but no Arial Narrow.
name: verify

# …and smoke needs something other than a person remembering, too. smoke.cjs was
# written after an audit found the production alias three releases back, and the
# remedy was a manual script plus one README sentence — so the same class
# recurred: production sat on one commit while the branch grew 241 ahead of it,
# for weeks, and again the only thing that noticed was an audit. A script nothing
# runs is a script nothing runs.
# deployment_status is what the Vercel integration emits, so a deploy that went
# out and went out WRONG is caught within a minute of promotion; the daily
# schedule is what catches the other half, a deploy that never happened at all,
# which is the case that actually occurred and which no push-triggered job can
# see. workflow_dispatch so it can be asked directly.
on:
  push:
    branches: ['**']
  pull_request:
  deployment_status:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# A run whose commit has been superseded is describing a tree nobody has any
# more: pushing three times in five minutes queued three ten-minute suites and
# reported on all three. Keyed on the ref, so branches never cancel each other,
# and on the event, so a push cannot cancel the origin-probing runs — those are
# about production rather than about a commit, and cancel-in-progress is off for
# them for the same reason.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  verify:
    # the suite belongs to a commit, so the two origin-probing triggers skip it
    # …and a same-repo pull request is a push AND a pull_request, which ran the
    # ten-minute job twice on one commit for the same answer. The pull_request
    # arm is kept for the case no push on this repository can cover — a PR from
    # a fork, whose commits never touch this repo's refs.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    # The suite runs about twenty minutes and its failure mode at the end is a
    # browser.close() that never returns — verify.cjs's own record has a run
    # where two suites shared a machine and neither finished. With no
    # timeout-minutes GitHub's default is 360, so a wedged Chrome holds a runner
    # for six hours and the concurrency group above holds every later push on
    # that ref behind it. 45 is a little over twice the honest run time: high
    # enough that a slow runner is not reported as a hang, low enough that a
    # hang is not reported as a slow runner.
    timeout-minutes: 45
    # This job reads a repository and runs a test suite; it has no reason to be
    # able to write one. With no `permissions:` block the job took the
    # repository's default GITHUB_TOKEN scope, and actions/checkout leaves that
    # token in $GITHUB_WORKSPACE/.git/config as an http.extraheader unless told
    # not to — so the line below that executes third-party install code was doing
    # so a directory away from a push credential for this repository, in a
    # workflow that runs on every push to every branch.
    permissions:
      contents: read
    steps:
      # PINNED BY DIGEST, both of them. `@v4` is a mutable major tag resolved at
      # run time, so these two lines execute whatever the tag points at when the
      # job starts — which is the same 'the tag moved' shape the puppeteer note
      # below cites, and the shape of the 2025-03 tj-actions/changed-files
      # incident, where a retagged major was the whole attack. The note used to
      # call that install 'the only line in the job that executes third-party
      # code' with these two standing above it; it was not, and a maintainer who
      # believed it would have thought the surface closed.
      # Digests are v4.4.0 of each, the tip of both v4 tags when this was pinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # engines.node's FLOOR. The range is open (">=22.12"), so this pin is
          # the low end of what the project claims to support, not the version
          # the deploy uses — Vercel reads the same range and takes the highest
          # supported major. The build-on-latest job below covers that end.
          node-version: '22.12'
          cache: npm
      # --ignore-scripts here too, for the reason spelled out for the ci/ tree
      # below: the root install has no script it needs. Of package-lock.json's
      # 117 entries exactly one declares an install script — fsevents, os:darwin,
      # so never on ubuntu-latest — and the root package.json has no prepare or
      # postinstall. So this flag changes nothing that runs today and closes the
      # same class for the 116 locked dependencies that the ci/ line closes for
      # its 27: a compromised patch whose whole payload is a postinstall.
      # Deliberately NOT applied to the puppeteer install two lines down, which
      # is run by name on its own line precisely so it stays deliberate.
      - run: npm ci --ignore-scripts
      # Chrome for the puppeteer checks, from ITS OWN LOCKFILE.
      #
      # `npm i puppeteer@25.8.0` pinned one package out of the 27 it installs.
      # Six were exact — puppeteer, puppeteer-core, @puppeteer/browsers,
      # chromium-bidi, devtools-protocol, webdriver-bidi-protocol — and the tree
      # they pull declares 29 caret ranges (ws@^8.21.1, zod@^3.24.1,
      # yargs@^18.0.0, strip-ansi@^7.1.0, ansi-regex@^6.2.2 and the rest), so 21
      # of the 27 were whatever the registry served as the newest matching patch
      # at that minute, with no `integrity` anywhere. A compromised patch of any
      # one of them — the 2025-09 Shai-Hulud pattern, where the new version adds
      # a postinstall — was installed and executed here, either at install time
      # or inside the puppeteer process the suite drives.
      # The comment this replaces cited the 2025-09-08 chalk/debug incident,
      # which WAS a transitive compromise: an exact top-level pin does not stop
      # one, it only fixes which puppeteer asks for ws@^8.21.1.
      # ci/package-lock.json pins all 27 by `resolved` + `integrity`, and
      # `npm ci` refuses anything the lockfile does not describe. Dependabot
      # moves it on purpose (.github/dependabot.yml).
      #
      # --ignore-scripts, because exactly one of those 27 declares an install
      # script and it is puppeteer's own Chrome download. It is run on the next
      # line instead: deliberately, by name, AFTER the tree has been
      # integrity-checked, rather than as a side effect of resolution.
      #
      # `npm ci` at the repo root still runs none: of its 117 package-lock
      # entries exactly one declares an install script (fsevents, os:darwin, so
      # never on ubuntu-latest) and 116 carry `resolved` + `integrity` — the
      # 117th is the root entry `""`, which has neither by construction.
      #
      # What this does NOT cover, and should not be read as covering: the Chrome
      # build itself is an unhashed HTTPS download from storage.googleapis.com,
      # pinned only by puppeteer's own revisions table.
      - run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund
      # …and the ~170 MB Chrome that install.mjs fetches is not in `cache: npm`,
      # which caches the npm registry tarballs and knows nothing about
      # ~/.cache/puppeteer. Keyed on the resolved puppeteer version out of ci's
      # own lockfile — the thing that decides WHICH Chrome revision is wanted —
      # so a Dependabot bump of that lockfile misses the cache on purpose and
      # every other run hits it. install.mjs still runs either way: it is
      # idempotent and exits early when the revision is already there, which
      # also means a partially-restored cache repairs itself rather than being
      # trusted.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('ci/package-lock.json') }}
      - run: node ci/node_modules/puppeteer/install.mjs
      # PUPPETEER_PATH is a puppeteer PACKAGE DIRECTORY (README.md), and
      # verify.cjs require()s it — so it has to be absolute, or node reads it as
      # a bare package name and looks in node_modules.
      - run: npm run verify:v3
        env:
          PUPPETEER_PATH: ${{ github.workspace }}/ci/node_modules/puppeteer
      - run: npm run verify
        env:
          PUPPETEER_PATH: ${{ github.workspace }}/ci/node_modules/puppeteer

  # The Node major Vercel ACTUALLY builds on, which the job above does not use.
  #
  # engines.node is ">=22.12", an open range, and Vercel reads it and picks the
  # highest supported major — its build log says so, warning that such a range
  # "will automatically upgrade when a new major Node.js version is released".
  # setup-node '22.12' above resolves to 22.12.0, the only 22.12.x, for ever. So
  # the gate and the deploy have been on different majors, and nothing here has
  # ever run the deploy's own command on the deploy's own Node.
  #
  # This runs exactly what Vercel runs — vercel.json's buildCommand is
  # `npm run build`, i.e. tsc && oxlint && vite build, and NOT the puppeteer
  # suite — so it costs about a minute rather than doubling the twenty-minute
  # job. `24` tracks the newest supported major the same way engines.node does;
  # if that range is ever capped, this pin is the other half to move.
  build-on-latest:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  # The deployed origin, which the job above cannot see: it checks the commit it
  # was handed, and every question smoke asks is about what readers are actually
  # served. No secrets, because it is GET-only.
  #
  # It DOES build, though smoke.cjs itself imports only node builtins and
  # vercel.json. Its sharpest check compares the deployed entry chunk against
  # the one in ./dist, and ./dist is gitignored, so on a bare checkout
  # localEntry() returns null and that check is false however healthy
  # production is. Added without a build, this job was red on every run —
  # including the runs where the deploy was perfect — which is the cry-wolf
  # the exit-2 handling below exists to avoid, and it would have buried the one
  # failure the job was written for under a permanent red. `npx vite build` and
  # not `npm run build`: the bundle is all this job compares, and folding tsc
  # and oxlint in would let a lint warning turn a question about production
  # red. The verify job already runs both on every push.
  smoke:
    # deployment_status fires for preview deployments as well, hence the
    # environment filter; the schedule and a manual run always qualify.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'deployment_status'
          && github.event.deployment_status.state == 'success'
          && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
      # --ignore-scripts for the reason the verify job uses it: nothing in this
      # job needs a browser, and puppeteer's postinstall would fetch one.
      - run: npm ci --ignore-scripts
      - run: npx vite build
      # exit 1 is a real answer about the deploy and fails the job. exit 3 is a
      # real answer too: the origin answered and what it answered is broken — a
      # redirect loop, an unreadable Location, a socket that connected and then
      # went silent. Those reject before the first check runs, so they carry no
      # ck() line, and they used to leave by the same exit 2 the downgrade below
      # is for: the site could be down for every reader and this job green.
      # exit 2 alone now means smoke never got far enough to have an opinion —
      # DNS, a refused connection, GitHub's egress — which is not this
      # repository's news and must not cry wolf every morning. Annotated, not
      # failed; everything else fails.
      - name: smoke the deployed origin
        run: |
          set +e
          node scripts/smoke.cjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::smoke could not reach the origin (exit 2) — network, not the deploy"
            exit 0
          fi
          exit $code
